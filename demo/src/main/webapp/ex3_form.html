<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Insert title here</title>
</head>
<body>
<form action="Ex3Servlet" method="post">
  <label>Name:</label>
  <input type="text" name="m_name"><br>
  <label>Age:</label>
  <input type="number" name="m_age"><br>
  <button type="button" onclick="sendData(this.form)">Send</button>
</form>
<script>
  function sendData(ff) {
    // ff에 있는 m_name 과 m_age 에 대한 유효성 검사 실행...
    ff.submit(); // 서버로 데이터를 보낸다
  }
</script>
</body>
</html>
